# Render Blueprint for ModelXGit: New > Blueprint > pick this repo and branch.
# The secrets (sync: false) are asked for once in the Render dashboard; they never go in git.
services:
  - type: web
    name: modelxgit
    runtime: docker
    plan: starter          # a persistent disk needs a paid instance
    region: virginia       # close to IBM Bob (us-east)
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: modelxgit-data
      mountPath: /data     # clones, saved jobs and today's usage count
      sizeGB: 5
    envVars:
      # --- secrets: filled in on the Render dashboard ---
      - key: BOB_API_KEY
        sync: false
      - key: ACCESS_CODE          # the code you give judges and teammates
        sync: false
      - key: BOB_ACCEPT_LICENSE   # "true" only if the key owner accepted the IBM Bob Shell license
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # --- settings ---
      - key: BOB_CLIENT
        value: shell
      - key: WORKSPACE_DIR
        value: /data/workspace
      # One Bob Shell run uses about 250 MB: three at once don't fit the Starter plan's 512 MB.
      # On a plan with 2 GB (Standard) set this to 3 for faster onboardings.
      - key: MAX_PARALLEL_SKILLS
        value: "1"
      - key: MAX_ONBOARDINGS_PER_DAY
        value: "15"
      - key: MAX_SKILL_RUNS_PER_DAY
        value: "60"
      - key: MAX_ACTIVE_ONBOARDINGS
        value: "1"
      - key: MAX_REPO_MB
        value: "200"
      - key: MAX_STORED_JOBS
        value: "40"
      - key: ALLOWED_GIT_HOSTS
        value: github.com
