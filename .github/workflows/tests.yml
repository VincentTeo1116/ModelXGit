name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (fake Bob, no key, no network)
        run: pytest -q
      - name: Secret scan of the working tree
        run: python skills/secret-precommit-scanner/scripts/precommit_scan.py --working-tree
